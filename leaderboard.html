<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranglijsten</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="btn-home" href="index.html" aria-label="Home">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="#ffffff" aria-hidden="true">
      <path d="M12 2.5 1.5 12h3v9.5h5.5v-6h4v6h5.5V12h3z"/>
    </svg>
  </a>

  <main class="boardpage">
    <h1>Ranglijsten</h1>

    <div class="toggles">
      <button class="toggle on" type="button" data-period="all">Altijd</button>
      <button class="toggle" type="button" data-period="year">Dit jaar</button>
      <button class="toggle" type="button" data-period="month">Deze maand</button>
    </div>

    <p class="msg" id="boardMsg" role="status"></p>
    <div id="boards"></div>
  </main>

  <script src="config.js"></script>
  <script src="database.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
