<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bim Bam Blunt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-blunt" data-game="blunt">
  <a class="btn-home" id="home" href="index.html" aria-label="Home">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="#ffffff" aria-hidden="true">
      <path d="M12 2.5 1.5 12h3v9.5h5.5v-6h4v6h5.5V12h3z"/>
    </svg>
  </a>

  <!-- Choose the players (also used as the game settings during a game) -->
  <main class="setup" id="setup">
    <h1 id="setupTitle">Wie spelen er mee?</h1>
    <div class="players" id="players"></div>
    <p class="msg" id="setupMsg" role="status"></p>
    <div class="toggles">
      <button class="toggle" id="jillaToggle" type="button" aria-pressed="false">Jilla: uit</button>
      <button class="toggle" id="rankedToggle" type="button" aria-pressed="false">Ranked: uit</button>
    </div>
    <button class="btn btn-main" id="start" type="button" disabled>Start</button>
  </main>

  <!-- The game -->
  <main class="game" id="game" hidden>
    <div class="turn" id="turn"></div>
    <div class="question" id="question"></div>

    <!-- Put your character image at assets/character.png -->
    <img class="character" src="assets/character.png" alt="" onerror="this.style.display='none'">

    <div class="letter" id="letter"></div>
    <div class="timer" id="timer">30</div>

    <!-- Shown instead of the character and timer when a player goes to Jilla. Put the image at assets/jail.png -->
    <div class="jail">
      <img src="assets/jail.png" alt="" onerror="this.style.display='none'">
      <span>Je gaat Jilla</span>
    </div>

    <div class="actions">
      <button class="btn btn-main" id="next" type="button">Volgende vraag</button>
      <div class="multi">
        <button class="btn btn-main" id="double" type="button">Dubbel</button>
        <button class="btn btn-main" id="triple" type="button">Trippel</button>
      </div>
    </div>

    <button class="btn btn-jilla" id="jilla" type="button">Jilla</button>
    <button class="btn-gamesettings" id="gameSettings" type="button" aria-label="Spelinstellingen" title="Spelinstellingen">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
    <button class="btn btn-back" id="back" type="button">Terug</button>
  </main>

  <!-- Recap after pressing Home in a ranked game -->
  <main class="setup" id="recap" hidden>
    <h1>Samenvatting</h1>
    <div class="board" id="recapList"></div>
    <p class="msg" id="recapJilla"></p>
    <p class="msg" id="recapMsg" role="status"></p>
    <button class="btn btn-main" id="retrySave" type="button" hidden>Opnieuw opslaan</button>
    <a class="btn btn-main" href="index.html">Naar het menu</a>
  </main>

  <script src="database.js"></script>
  <script src="game.js"></script>
</body>
</html>
