<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instellingen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="btn-home" href="index.html" aria-label="Home">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="#ffffff" aria-hidden="true">
      <path d="M12 2.5 1.5 12h3v9.5h5.5v-6h4v6h5.5V12h3z"/>
    </svg>
  </a>

  <main class="setup" id="settingsMain">
    <h1>Instellingen</h1>

    <button class="btn btn-main" id="openCreate" type="button">Account aanmaken</button>
    <form class="create" id="createForm" hidden>
      <label>Accountnaam
        <input id="name" type="text" maxlength="20" autocomplete="off" required>
      </label>
      <label>Admincode
        <input id="code" type="password" autocomplete="off" required>
      </label>
      <button class="btn btn-main" id="submit" type="submit">Aanmaken</button>
      <p class="msg" id="createMsg" role="status"></p>
    </form>

    <button class="btn btn-main" id="openList" type="button">Accounts</button>
    <div class="players" id="accountList" hidden></div>
    <p class="msg" id="listMsg" role="status"></p>
  </main>

  <!-- Admin code at the bottom of the screen, only while the account list is open -->
  <form class="adminbar" id="adminBar" hidden>
    <input id="adminCode" type="password" placeholder="Admincode" autocomplete="off">
    <button class="btn btn-main" id="unlock" type="submit">OK</button>
    <button class="btn btn-main" id="delete" type="button" hidden>Verwijderen</button>
  </form>

  <script src="database.js"></script>
  <script src="settings.js"></script>
</body>
</html>
